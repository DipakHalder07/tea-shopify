<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <defs>
    <style>
      .b-stem { stroke: #FFF5EA; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .b-leaf-out { stroke: #FFF5EA; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; fill: rgba(255, 245, 234, 0.03); }
      .b-vein-main { stroke: #FFF5EA; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .b-vein-sub { stroke: #FFF5EA; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .b-bud { stroke: #FFF5EA; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: rgba(255, 245, 234, 0.05); }
    </style>
  </defs>

  <g opacity="0.18">
    <!-- Main Arching Botanical Stem -->
    <path d="M 80 540 C 140 450, 210 340, 310 230 C 370 160, 440 100, 520 60" class="b-stem" />

    <!-- Leaf 1 (Lower Left - Large Mature Leaf) -->
    <g>
      <path d="M 170 420 C 70 430, 20 370, 30 310 C 110 300, 160 370, 170 420 Z" class="b-leaf-out" />
      <path d="M 170 420 C 110 370, 60 340, 30 310" class="b-vein-main" />
      <path d="M 130 390 C 100 370, 70 380, 50 390" class="b-vein-sub" />
      <path d="M 95 360 C 75 340, 55 350, 40 360" class="b-vein-sub" />
      <path d="M 145 405 C 130 420, 110 425, 90 425" class="b-vein-sub" />
    </g>

    <!-- Leaf 2 (Mid Stem - Right Side) -->
    <g>
      <path d="M 230 340 C 330 330, 410 390, 440 460 C 350 480, 270 420, 230 340 Z" class="b-leaf-out" />
      <path d="M 230 340 C 320 390, 390 430, 440 460" class="b-vein-main" />
      <path d="M 280 370 C 310 350, 340 355, 370 365" class="b-vein-sub" />
      <path d="M 330 400 C 360 385, 390 390, 410 405" class="b-vein-sub" />
      <path d="M 300 415 C 290 440, 270 455, 250 465" class="b-vein-sub" />
    </g>

    <!-- Leaf 3 (Upper Mid Stem - Left Side) -->
    <g>
      <path d="M 320 220 C 230 180, 190 110, 220 50 C 290 80, 320 160, 320 220 Z" class="b-leaf-out" />
      <path d="M 320 220 C 275 155, 245 105, 220 50" class="b-vein-main" />
      <path d="M 290 180 C 260 180, 235 170, 215 155" class="b-vein-sub" />
      <path d="M 265 135 C 240 135, 225 125, 215 110" class="b-vein-sub" />
      <path d="M 300 170 C 305 140, 300 115, 285 95" class="b-vein-sub" />
    </g>

    <!-- Leaf 4 (Upper Stem - Right Side) -->
    <g>
      <path d="M 410 145 C 500 120, 560 160, 580 230 C 500 240, 440 190, 410 145 Z" class="b-leaf-out" />
      <path d="M 410 145 C 480 180, 540 210, 580 230" class="b-vein-main" />
      <path d="M 450 165 C 475 145, 505 145, 530 155" class="b-vein-sub" />
      <path d="M 490 190 C 520 180, 545 185, 565 195" class="b-vein-sub" />
    </g>

    <!-- Terminal Two Leaves and a Bud (Shoot Tip) -->
    <g>
      <!-- Terminal Leaf Left -->
      <path d="M 480 85 C 470 30, 495 -10, 540 -20 C 550 30, 520 70, 480 85 Z" class="b-leaf-out" />
      <path d="M 480 85 C 495 40, 515 15, 540 -20" class="b-vein-main" />
      <!-- Terminal Bud -->
      <path d="M 520 60 C 545 35, 575 20, 600 15 C 585 45, 560 65, 520 60 Z" class="b-bud" />
    </g>

    <!-- Floating Dewdrops & Tea Buds -->
    <circle cx="280" cy="280" r="4.5" fill="#FFF5EA" opacity="0.3" />
    <circle cx="460" cy="110" r="3.5" fill="#FFF5EA" opacity="0.3" />
    <circle cx="160" cy="350" r="4.0" fill="#FFF5EA" opacity="0.25" />
  </g>
</svg>
