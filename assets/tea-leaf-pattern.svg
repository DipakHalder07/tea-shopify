<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" fill="none">
  <defs>
    <style>
      .leaf-stem { stroke: #FFF5EA; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .leaf-outline { stroke: #FFF5EA; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: rgba(255, 245, 234, 0.02); }
      .leaf-vein { stroke: #FFF5EA; stroke-width: 0.8; stroke-linecap: round; stroke-linejoin: round; }
      .bud { fill: #FFF5EA; opacity: 0.12; }
    </style>
  </defs>

  <!-- Group 1: Main Camellia Sinensis Tea Sprig (Two leaves and a bud) -->
  <g transform="translate(50, 50) rotate(-16)" opacity="0.13">
    <!-- Main stem -->
    <path d="M 16 90 C 20 66, 28 44, 40 20" class="leaf-stem" />
    <!-- Left Mature Leaf -->
    <path d="M 24 58 C 4 52, -16 34, -10 16 C 6 12, 28 32, 28 54 Z" class="leaf-outline" />
    <path d="M 26 56 C 14 42, 4 30, -5 20" class="leaf-vein" />
    <path d="M 18 48 C 11 44, 4 45, 0 49" class="leaf-vein" />
    <path d="M 12 40 C 6 36, -1 37, -4 40" class="leaf-vein" />
    <path d="M 7 32 C 2 28, -3 27, -6 28" class="leaf-vein" />
    <path d="M 20 44 C 23 38, 25 32, 24 26" class="leaf-vein" />
    <!-- Right Leaf -->
    <path d="M 32 46 C 54 36, 72 44, 75 62 C 60 72, 40 62, 34 48 Z" class="leaf-outline" />
    <path d="M 33 47 C 46 52, 59 57, 71 61" class="leaf-vein" />
    <path d="M 44 51 C 48 47, 54 46, 58 43" class="leaf-vein" />
    <path d="M 52 54 C 56 52, 62 52, 65 50" class="leaf-vein" />
    <path d="M 41 55 C 44 60, 48 64, 52 66" class="leaf-vein" />
    <!-- Tender Center Bud -->
    <path d="M 40 20 C 37 10, 42 2, 45 -6 C 48 2, 46 12, 40 20 Z" class="leaf-outline" fill="rgba(255, 245, 234, 0.05)" />
    <path d="M 40 20 C 42 12, 43 5, 45 -4" class="leaf-vein" />
  </g>

  <!-- Group 2: Graceful Curved Tea Leaf (Top Right) -->
  <g transform="translate(195, 55) rotate(35)" opacity="0.12">
    <path d="M -25 -10 C 5 -32, 38 -20, 48 5 C 28 22, -8 18, -25 -10 Z" class="leaf-outline" />
    <path d="M -23 -9 C -4 -10, 20 -4, 45 4" class="leaf-vein" />
    <path d="M -10 -10 C -6 -18, 0 -22, 8 -24" class="leaf-vein" />
    <path d="M 6 -7 C 12 -14, 20 -16, 28 -17" class="leaf-vein" />
    <path d="M -3 -8 C 2 0, 8 6, 15 10" class="leaf-vein" />
    <path d="M 15 -5 C 20 2, 26 7, 32 9" class="leaf-vein" />
  </g>

  <!-- Group 3: Second Tea Sprig (Bottom Right) -->
  <g transform="translate(185, 200) rotate(-42)" opacity="0.11">
    <path d="M 12 75 C 16 55, 24 35, 34 18" class="leaf-stem" />
    <!-- Leaf A -->
    <path d="M 20 48 C 5 40, -12 26, -6 10 C 8 8, 25 24, 24 44 Z" class="leaf-outline" />
    <path d="M 21 46 C 11 34, 2 24, -3 14" class="leaf-vein" />
    <path d="M 14 38 C 8 35, 2 36, -1 39" class="leaf-vein" />
    <!-- Leaf B -->
    <path d="M 26 38 C 45 30, 60 38, 62 52 C 50 60, 34 52, 28 40 Z" class="leaf-outline" />
    <path d="M 27 39 C 38 43, 49 47, 59 50" class="leaf-vein" />
    <!-- Bud -->
    <path d="M 34 18 C 31 10, 36 3, 38 -3 C 41 4, 39 12, 34 18 Z" class="leaf-outline" />
  </g>

  <!-- Group 4: Floating Loose Leaf (Bottom Left) -->
  <g transform="translate(50, 205) rotate(18)" opacity="0.11">
    <path d="M -22 10 C -5 -6, 16 -9, 32 2 C 18 17, -2 22, -22 10 Z" class="leaf-outline" />
    <path d="M -20 10 C -2 3, 14 1, 30 3" class="leaf-vein" />
    <path d="M -9 7 C -5 -1, 1 -4, 7 -5" class="leaf-vein" />
    <path d="M 5 3 C 9 8, 15 11, 22 12" class="leaf-vein" />
  </g>

  <!-- Group 5: Small Floating Leaf at Center -->
  <g transform="translate(135, 125) rotate(68)" opacity="0.10">
    <path d="M -16 0 C -4 -12, 12 -9, 20 0 C 12 11, -4 9, -16 0 Z" class="leaf-outline" />
    <path d="M -15 0 C -2 -1, 7 -1, 18 0" class="leaf-vein" />
    <path d="M -4 -1 C -1 -6, 4 -7, 8 -7" class="leaf-vein" />
  </g>

  <!-- Floating Organic Tea Buds & Stippled Herbal Spores -->
  <circle cx="110" cy="40" r="1.5" class="bud" />
  <circle cx="120" cy="43" r="1.0" class="bud" opacity="0.06" />
  <circle cx="35" cy="135" r="1.8" class="bud" />
  <circle cx="245" cy="140" r="1.6" class="bud" />
  <circle cx="150" cy="250" r="1.4" class="bud" />
  <circle cx="230" cy="260" r="1.8" class="bud" />
  <circle cx="95" cy="160" r="1.3" class="bud" />
</svg>
